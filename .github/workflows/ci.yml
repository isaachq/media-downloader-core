name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # the Node 22 runs keep their old names: branch protection requires them by name
    name: ${{ matrix.node == 22 && matrix.os || format('{0} · node {1}', matrix.os, matrix.node) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # the engine's supported range (engines.node >= 20): oldest and newest LTS, on one OS each
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ffmpeg/ffprobe enable the integrity test suite (it is skipped without them)
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the package as a consumer gets it: packed, installed in an empty project, loaded as ESM and CJS
      - run: npm run pack:check

      # the real thing: download, checksum-verify and test yt-dlp + ffmpeg, then diagnose
      - name: mdc setup (real install)
        run: node dist/cli.js setup --force --data-dir ./.ci-data --no-color
      - name: mdc doctor
        run: node dist/cli.js doctor --data-dir ./.ci-data --no-color

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox
      # needs; installed packages get an AppArmor profile for it (see the .deb), here
      # the runner allows them so the app is tested with its sandbox on
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # the real Electron app, driven by Playwright with the engine's fake tools
      - name: End-to-end
        if: runner.os != 'Linux'
        run: npm run test:e2e
        working-directory: app
      - name: End-to-end (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        working-directory: app
      # packaging breaks quietly (a missing tool, a bad target): build the Linux packages
      # on every PR so a release tag never finds out first
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          npx electron-builder --linux --publish never
          ls -l dist/*.AppImage dist/*.deb dist/*.rpm
        working-directory: app
