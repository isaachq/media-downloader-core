name: CI

# Two depths, one workflow. Budget: every job of a pull request finishes in 5 minutes
# (timeout-minutes cuts it there); what is heavy runs locally with `npm run test:full`.
#
# - smoke (every pull request): what breaks per platform, as fast as it can be told.
#   Every OS runs the library's fast suite (no ffmpeg, no network) and the app's unit
#   tests; Linux also runs types, lint, the website check, the integrity smoke with a
#   cached static ffmpeg, the packed package and the three end-to-end tests tagged @smoke.
# - full (Actions tab → CI → Run workflow → full): the whole regression — Node 20 and
#   24 too, the heavy suites with ffmpeg and every end-to-end test on every OS, a real
#   yt-dlp/ffmpeg install, the Linux packages. Locally the same suite is
#   `npm run test:full` (see CONTRIBUTING.md → Development), which runs before every PR.
#
# A pull request that only touches documentation runs the same jobs (branch protection
# requires them by name), but their test steps are skipped: lint and the website check
# run once, in seconds.
#
# No run on push to main: branch protection is strict (a pull request must be up to
# date with main), so the merged tree is the one the pull request already checked.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Full regression (every OS end to end, Node 20 and 24, real install, packages)
        type: boolean
        default: true

# a new push to a pull request stops the run it makes stale
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # code = anything that is not documentation; a docs-only PR skips the test steps
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!documentation/**'
              - '!**/*.md'
              - '!PRIVACY*'

  check:
    # the Node 22 runs keep their old names: branch protection requires them by name
    name: ${{ matrix.node == 22 && matrix.os || format('{0} · node {1}', matrix.os, matrix.node) }}
    needs: changes
    runs-on: ${{ matrix.os }}
    # full runs carry the heavy suites and a real install: they get more room
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 30 || 5 }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        # the engine's supported range (engines.node >= 20): oldest and newest LTS, full runs only
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full && '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":24}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Linux' || env.CODE == 'true'
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' || env.CODE == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux' || env.CODE == 'true'
        run: npm ci

      # types, lint and the website read the same files on every system: once is enough.
      # A docs-only PR still runs lint and the website check (the generated language
      # pages must not drift).
      - if: runner.os == 'Linux' && env.CODE == 'true' || env.FULL == 'true'
        run: npm run typecheck
      - if: runner.os == 'Linux' || env.FULL == 'true'
        run: npm run lint
      - if: runner.os == 'Linux' || env.FULL == 'true'
        run: npm run site:check

      # no ffmpeg, no network: well under 90 s on every OS
      - if: env.CODE == 'true'
        run: npm run test:fast

      # a static ffmpeg, cached: no apt-get update on every run. Linux only in smoke runs
      - name: Cache ffmpeg (Linux)
        if: runner.os == 'Linux' && env.CODE == 'true'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-linux-${{ runner.arch }}-v1
      - name: Install ffmpeg (Linux, static)
        if: runner.os == 'Linux' && env.CODE == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=1
      - name: Put ffmpeg on the PATH (Linux)
        if: runner.os == 'Linux' && env.CODE == 'true'
        run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS' && env.FULL == 'true'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows' && env.FULL == 'true'
        run: choco install ffmpeg -y --no-progress

      # one video and one audio check with the real ffmpeg, about 30 s
      - if: runner.os == 'Linux' && env.CODE == 'true'
        run: npm run test:integrity-smoke
      # the suites that encode real media: full runs here, `npm run test:full` locally
      - if: env.FULL == 'true'
        run: npm run test:heavy

      - if: env.CODE == 'true'
        run: npm run build
      # the package as a consumer gets it: packed, installed in an empty project, loaded as ESM and CJS
      - if: runner.os == 'Linux' && env.CODE == 'true' || env.FULL == 'true'
        run: npm run pack:check

      # the real thing: download, checksum-verify and test yt-dlp + ffmpeg, then diagnose
      - name: mdc setup (real install)
        if: env.FULL == 'true'
        run: node dist/cli.js setup --force --data-dir ./.ci-data --no-color
      - name: mdc doctor
        if: env.FULL == 'true'
        run: node dist/cli.js doctor --data-dir ./.ci-data --no-color

  app:
    name: app (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 30 || 5 }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        if: env.CODE == 'true'
      - uses: actions/setup-node@v4
        if: env.CODE == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # Electron's binary is downloaded by every `npm ci` unless it is cached
      - name: Cache Electron
        if: env.CODE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      - if: env.CODE == 'true'
        run: npm ci && npm run build
      - if: env.CODE == 'true'
        run: npm ci
        working-directory: app
      - if: env.CODE == 'true' && (runner.os == 'Linux' || env.FULL == 'true')
        run: npm run typecheck
        working-directory: app
      - if: env.CODE == 'true'
        run: npm test
        working-directory: app
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox
      # needs; installed packages get an AppArmor profile for it (see the .deb), here
      # the runner allows them so the app is tested with its sandbox on
      - name: Allow Chromium's sandbox (Linux)
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # the real Electron app, driven by Playwright with the engine's fake tools.
      # Smoke runs: Linux, the three tests tagged @smoke. Full runs: every test, every OS
      - name: End-to-end smoke (virtual display)
        if: env.CODE == 'true' && runner.os == 'Linux' && env.FULL != 'true'
        run: xvfb-run -a npm run test:e2e:smoke
        working-directory: app
      - name: End-to-end (virtual display)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: xvfb-run -a npm run test:e2e
        working-directory: app
      - name: End-to-end
        if: runner.os != 'Linux' && env.FULL == 'true'
        run: npm run test:e2e
        working-directory: app
      # a failed run keeps what it saw: error contexts, screenshots and the app's own output
      - name: Keep the end-to-end results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: app/test-results
          retention-days: 14
          if-no-files-found: ignore
      # packaging breaks quietly (a missing tool, a bad target): full runs build the Linux
      # packages so a release tag never finds out first (the release workflow builds them all)
      - name: Package (Linux)
        if: runner.os == 'Linux' && env.FULL == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          npx electron-builder --linux --publish never
          ls -l dist/*.AppImage dist/*.deb dist/*.rpm
        working-directory: app
