name: Publish library

# Push a tag like lib-v1.6.0 to publish media-downloader-core to npm, with
# provenance (npm shows it was built here, from this commit). Needs the
# repository secret NPM_TOKEN: an npm automation / granular token with
# publish rights for the package.
on:
  push:
    tags: ['lib-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # the integrity suite runs with a real ffmpeg
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: The tag matches package.json
        run: test "lib-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, lint, the tests and the build first
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
