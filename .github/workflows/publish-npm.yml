name: Publish library

# Push a tag like lib-v1.6.1 to publish media-downloader-core to npm.
# Trusted Publishing (OIDC): npm trusts this workflow of this repository
# (package settings → Trusted Publisher), so there is no token to keep —
# and the package gets provenance (npm shows it was built here, from this
# commit). Needs npm 11.5.1 or newer.
on:
  push:
    tags: ['lib-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # no registry-url: Trusted Publishing needs no .npmrc (setup-node's would add a
      # setting npm 11 warns about), and npm's default registry is the public one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: test "lib-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # no tests here: the pull request ran them, and `npm run test:full` ran the whole
      # regression locally before the tag. The tag only checks the version, builds and
      # publishes (well under 3 minutes). The build is here rather than in prepublishOnly,
      # so npm publish finds dist/ (and the CLI it names) already in place
      - run: npm run build
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public --ignore-scripts
