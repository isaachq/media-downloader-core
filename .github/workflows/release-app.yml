name: Release app

# Push a tag like app-v0.1.0-beta.1 to build the installers and attach them
# to a GitHub pre-release.
on:
  push:
    tags: ['app-v*']

permissions:
  contents: write
  # to start the winget manifests once the release exists
  actions: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
          - os: ubuntu-24.04-arm
            dist: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # Electron's binary is downloaded by every `npm ci` unless it is cached
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: app
      # the .rpm (Fedora / RHEL / openSUSE) is built with rpmbuild
      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm test && npm run ${{ matrix.dist }}
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # notes: the newest CHANGELOG section, then the install hint. A bare @word would
          # mention (and notify) a GitHub user of that name: such words become code
          awk '/^## /{n++} n==1' source/CHANGELOG.md \
            | sed -E 's/(^|[^A-Za-z0-9/`._-])@([A-Za-z0-9][A-Za-z0-9-]*)/\1`@\2`/g' > notes.md
          printf '\n---\nmacOS (arm64, x64), Windows (x64, arm64) and Linux (.deb, .rpm and AppImage, x64 and arm64). Not signed with an Apple / Microsoft certificate yet: on macOS use System Settings → Privacy & Security → Open Anyway (once) — or, when that button does not appear, run once in Terminal: `xattr -dr com.apple.quarantine "/Applications/Media Download Core.app"`; on Windows, More info → Run anyway. Details in the README.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Media Download Core ${GITHUB_REF_NAME#app-v}" \
            --notes-file notes.md
      # a release made with the workflow's token fires no "release published" event: start the
      # winget manifests (checked against Microsoft's schemas) from here instead
      - name: winget manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run winget.yml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
