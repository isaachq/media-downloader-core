name: Release app

# Push a tag like app-v0.1.0-beta.1 to build the installers and attach them
# to a GitHub pre-release.
on:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: app
      - run: npm test && npm run ${{ matrix.dist }}
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Media Download Core ${GITHUB_REF_NAME#app-v}" \
            --notes "Desktop beta for macOS (arm64, x64) and Windows (x64, arm64). Builds are not code-signed yet — see the README."
