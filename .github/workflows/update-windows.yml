name: Windows update

# The in-app update on a real Windows machine: install version A with its
# NSIS installer, offer version B from a local feed, press "Update now" and
# check what follows the app closing — for a user's install, for everyone's,
# and with an installer that fails (the old version must come back, saying why).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/updates/**'
      - 'app/src/main/index.ts'
      - 'app/package.json'
      - 'app/e2e/windows-update.ts'
      - '.github/workflows/update-windows.yml'

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: app
      # one build, packaged twice: A and B differ only by version
      - name: Installers A and B
        working-directory: app
        shell: pwsh
        run: |
          npx electron-vite build
          npm version --no-git-tag-version 0.0.1-test.1
          npx electron-builder --win --x64 --publish never
          npm version --no-git-tag-version 0.0.1-test.2
          npx electron-builder --win --x64 --publish never
          Get-ChildItem dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: app/dist/*.exe

  update:
    needs: installers
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        case: [user, machine, fail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Update A → B (${{ matrix.case }})
        shell: pwsh
        run: |
          $scope = if ('${{ matrix.case }}' -eq 'machine') { 'machine' } else { 'user' }
          $mode = if ('${{ matrix.case }}' -eq 'fail') { 'fail' } else { '' }
          npx tsx app/e2e/windows-update.ts installers/Media-Download-Core-0.0.1-test.1-win-x64.exe installers/Media-Download-Core-0.0.1-test.2-win-x64.exe 0.0.1-test.2 $scope $mode
