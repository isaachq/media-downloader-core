name: YouTube watch

# Every day: can the app still pass YouTube's attestation, and does YouTube
# accept its PO tokens? The app's own probe answers on a real Electron, with
# the real yt-dlp (MDC_YOUTUBE_PROBE). When YouTube changed something, a pull
# request — in English and Spanish — says so and what to do; it closes itself
# when the probe is healthy again. A runner YouTube bot-checks (datacenter IPs
# often are) is inconclusive, not an alert.
#
# The daily schedule and the pull request trigger are paused to stay within the CI
# minutes limit; run it by hand from the Actions tab (workflow_dispatch) until they
# are re-enabled.
on:
  # schedule:
  #   - cron: '17 6 * * *'
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'src/youtube/**'
  #     - 'app/src/main/youtube/**'
  #     - 'scripts/youtube-watch.mjs'
  #     - '.github/workflows/youtube-watch.yml'

permissions:
  contents: write
  pull-requests: write
  # the alert falls back to an issue when the repository doesn't let Actions open pull requests
  issues: write

concurrency:
  group: youtube-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: app
      - run: npx electron-vite build
        working-directory: app
      # yt-dlp (its latest release) and ffmpeg, checksum-verified, as the app installs them
      - name: Tools
        run: node dist/cli.js setup --data-dir "$RUNNER_TEMP/mdc" --no-color
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Probe
        id: probe
        continue-on-error: true
        working-directory: app
        env:
          MDC_DATA_DIR: ${{ runner.temp }}/mdc
          MDC_YOUTUBE_PROBE: ${{ runner.temp }}/youtube-probe.json
        run: timeout 600 xvfb-run -a npx electron out/main/index.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-probe
          path: ${{ runner.temp }}/youtube-probe.json
          if-no-files-found: warn
      # a pull request only fails on a broken probe; the schedule raises (or closes) the alert
      - name: Verdict
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ github.event_name != 'pull_request' && 'pr' || 'none' }}
        run: node scripts/youtube-watch.mjs "$RUNNER_TEMP/youtube-probe.json"
